<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Space probe icon in the style of Voyager (own work, OST): high-gain dish, bus,
       magnetometer boom, RTG boom and science boom. -->
  <g stroke-linecap="round" fill="none">
    <!-- magnetometer boom (long and thin) -->
    <path d="M64 66 L12 18" stroke="#0b0d16" stroke-width="5"/>
    <path d="M64 66 L12 18" stroke="#c9ced8" stroke-width="2.4"/>
    <!-- RTG boom with the three power units -->
    <path d="M66 70 L108 100" stroke="#0b0d16" stroke-width="6"/>
    <path d="M66 70 L108 100" stroke="#c9ced8" stroke-width="3"/>
    <!-- science boom -->
    <path d="M60 72 L24 102" stroke="#0b0d16" stroke-width="6"/>
    <path d="M60 72 L24 102" stroke="#c9ced8" stroke-width="3"/>
  </g>
  <g fill="#8d939f" stroke="#0b0d16" stroke-width="1.5">
    <rect x="94" y="86" width="9" height="9" rx="2" transform="rotate(35 98.5 90.5)"/>
    <rect x="102" y="92" width="9" height="9" rx="2" transform="rotate(35 106.5 96.5)"/>
    <rect x="16" y="96" width="14" height="10" rx="2" fill="#d9b25a" transform="rotate(-40 23 101)"/>
  </g>
  <!-- bus (gold thermal blankets) -->
  <polygon points="52,64 76,64 82,74 76,84 52,84 46,74" fill="#d9b25a" stroke="#0b0d16" stroke-width="2.5"/>
  <polygon points="56,68 72,68 76,74 72,80 56,80 52,74" fill="#f0cf7a"/>
  <!-- high-gain antenna dish -->
  <ellipse cx="64" cy="46" rx="36" ry="27" fill="#0b0d16"/>
  <ellipse cx="64" cy="46" rx="33" ry="24" fill="#f4f1ea"/>
  <ellipse cx="64" cy="49" rx="25" ry="16" fill="#d6dae3"/>
  <ellipse cx="64" cy="52" rx="14" ry="8" fill="#b9bfcb"/>
  <!-- feed horn on its struts -->
  <path d="M42 40 L64 30 L86 40" stroke="#5c6270" stroke-width="2" fill="none"/>
  <circle cx="64" cy="30" r="4.5" fill="#f4f1ea" stroke="#0b0d16" stroke-width="2"/>
</svg>
