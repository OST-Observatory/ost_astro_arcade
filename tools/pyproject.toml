[project]
name = "ost-arcade-tools"
version = "0.1.0"
description = "Offline data/asset pipeline for the OST Astro Arcade (Godot) kiosk"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "pyyaml>=6.0",
    "astropy>=7.0",
    "skyfield>=1.49",
    "astroquery>=0.4.10",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
