# One-sentence explanation per quiz question, shown right after answering.
# Drafted for review by the OST team (2026-10). Keys = question ids in questions.<lang>.yaml.
q1: {de: "Jupiter ist so groß, dass alle anderen Planeten zusammen in ihn hineinpassen würden.", en: "Jupiter is so big that all the other planets together would fit inside it.", es: "Júpiter es tan grande que todos los demás planetas juntos cabrían dentro de él."}
q2: {de: "Saturns Ringe bestehen aus unzähligen Eis- und Gesteinsbrocken – schon im kleinen Teleskop sichtbar.", en: "Saturn's rings are made of countless chunks of ice and rock – visible even in a small telescope.", es: "Los anillos de Saturno están formados por innumerables trozos de hielo y roca; se ven incluso con un telescopio pequeño."}
q3: {de: "Merkur umkreist die Sonne in nur 88 Tagen – auf seiner Tagseite wird es über 400 °C heiß.", en: "Mercury circles the Sun in only 88 days – its day side gets hotter than 400 °C.", es: "Mercurio da la vuelta al Sol en solo 88 días; en su lado diurno se superan los 400 °C."}
q4: {de: "Merkur, Venus, Erde, Mars, Jupiter, Saturn, Uranus und Neptun – Pluto zählt seit 2006 zu den Zwergplaneten.", en: "Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune – since 2006 Pluto counts as a dwarf planet.", es: "Mercurio, Venus, Tierra, Marte, Júpiter, Saturno, Urano y Neptuno; desde 2006 Plutón es un planeta enano."}
q5: {de: "Eisenoxid – also Rost – im Staub färbt die Marsoberfläche rötlich.", en: "Iron oxide – rust – in its dust gives Mars its reddish colour.", es: "El óxido de hierro (herrumbre) del polvo da a Marte su color rojizo."}
q6: {de: "Der Orionnebel ist eine Sternentstehungsregion im „Schwert“ des Orion, mit bloßem Auge als Nebelfleck sichtbar.", en: "The Orion Nebula is a star-forming region in Orion's 'sword', visible to the naked eye as a fuzzy patch.", es: "La nebulosa de Orión es una región de formación estelar en la «espada» de Orión, visible a simple vista."}
q7: {de: "Die fünf hellsten Sterne der Kassiopeia bilden ein auffälliges W (oder M) am Himmel.", en: "The five brightest stars of Cassiopeia form a striking W (or M) in the sky.", es: "Las cinco estrellas más brillantes de Casiopea forman una llamativa W (o M) en el cielo."}
q8: {de: "Der Polarstern ist der hellste Stern im Kleinen Bären und steht fast genau über dem Nordpol der Erde.", en: "Polaris is the brightest star in the Little Bear and sits almost exactly above Earth's North Pole.", es: "La Estrella Polar es la más brillante de la Osa Menor y está casi justo sobre el polo norte terrestre."}
q9: {de: "Galaxien enthalten Milliarden von Sternen, zusammengehalten von der Schwerkraft – und von viel Dunkler Materie.", en: "Galaxies contain billions of stars held together by gravity – and by a lot of dark matter.", es: "Las galaxias contienen miles de millones de estrellas unidas por la gravedad y por mucha materia oscura."}
q10: {de: "Das Licht legt die 150 Millionen km zur Erde in gut 8 Minuten zurück – wir sehen die Sonne also so, wie sie vor 8 Minuten war.", en: "Light covers the 150 million km to Earth in just over 8 minutes – we see the Sun as it was 8 minutes ago.", es: "La luz recorre los 150 millones de km hasta la Tierra en algo más de 8 minutos: vemos el Sol como era hace 8 minutos."}
q11: {de: "Sirius ist der hellste Stern am Nachthimmel – er ist nur 8,6 Lichtjahre entfernt.", en: "Sirius is the brightest star in the night sky – only 8.6 light-years away.", es: "Sirio es la estrella más brillante del cielo nocturno; está a solo 8,6 años luz."}
q12: {de: "Saturn hat inzwischen mehr als 270 bekannte Monde – die meisten sind nur wenige Kilometer groß.", en: "Saturn now has more than 270 known moons – most of them only a few kilometres across.", es: "Saturno tiene ya más de 270 lunas conocidas; la mayoría miden solo unos pocos kilómetros."}
q13: {de: "Im Hauptgürtel zwischen Mars und Jupiter kreisen über eine Million Asteroiden größer als 1 km.", en: "More than a million asteroids larger than 1 km orbit in the main belt between Mars and Jupiter.", es: "Más de un millón de asteroides mayores de 1 km orbitan en el cinturón principal entre Marte y Júpiter."}
q14: {de: "Mars ist weiter von der Sonne entfernt und braucht 687 Erdtage für einen Umlauf.", en: "Mars is farther from the Sun and needs 687 Earth days for one orbit.", es: "Marte está más lejos del Sol y necesita 687 días terrestres para una vuelta."}
q15: {de: "Merkur ist mit 4.880 km Durchmesser kaum größer als unser Mond.", en: "At 4,880 km across, Mercury is barely larger than our Moon.", es: "Con 4.880 km de diámetro, Mercurio es apenas mayor que nuestra Luna."}
q16: {de: "Nahe der Sonne verdampft das Eis eines Kometen – Gas und Staub bilden dann den leuchtenden Schweif.", en: "Near the Sun a comet's ice evaporates – gas and dust then form the glowing tail.", es: "Cerca del Sol el hielo de un cometa se evapora; el gas y el polvo forman entonces la cola brillante."}
q17: {de: "Meist sind es winzige Staubkörnchen von Kometen oder Asteroiden (Meteoroide), die in rund 100 km Höhe verglühen.", en: "Most are tiny dust grains from comets or asteroids (meteoroids) burning up about 100 km above the ground.", es: "Casi siempre son diminutos granos de polvo de cometas o asteroides (meteoroides) que arden a unos 100 km de altura."}
q18: {de: "Bei einer Supernova leuchtet ein einzelner Stern kurzzeitig heller als seine ganze Galaxie.", en: "In a supernova a single star briefly outshines its entire galaxy.", es: "En una supernova una sola estrella brilla brevemente más que toda su galaxia."}
q19: {de: "Diese Definition stammt von 2006 – Pluto erfüllt den dritten Punkt nicht und ist deshalb ein Zwergplanet.", en: "This definition dates from 2006 – Pluto fails the third point and is therefore a dwarf planet.", es: "Esta definición es de 2006; Plutón no cumple el tercer punto y por eso es un planeta enano."}
q20: {de: "In Sternen verschmelzen Atomkerne – bei der Sonne Wasserstoff zu Helium – und setzen dabei riesige Energie frei.", en: "In stars atomic nuclei fuse – in the Sun hydrogen into helium – releasing enormous energy.", es: "En las estrellas se fusionan núcleos atómicos (en el Sol, hidrógeno en helio) liberando una enorme energía."}
q21: {de: "Orbit kommt vom lateinischen „orbis“ – Kreis, Bahn.", en: "'Orbit' comes from the Latin 'orbis' – circle, track.", es: "«Órbita» viene del latín «orbis»: círculo, camino."}
q22: {de: "Das Magnetfeld lenkt die geladenen Teilchen des Sonnenwinds ab – an den Polen erzeugen sie Polarlichter.", en: "The magnetic field deflects the charged particles of the solar wind – near the poles they create auroras.", es: "El campo magnético desvía las partículas cargadas del viento solar; cerca de los polos producen auroras."}
q23: {de: "Merkur ist der kleinste Planet – sogar kleiner als der Jupitermond Ganymed.", en: "Mercury is the smallest planet – even smaller than Jupiter's moon Ganymede.", es: "Mercurio es el planeta más pequeño, incluso menor que Ganímedes, la luna de Júpiter."}
q24: {de: "Methan in Neptuns Atmosphäre verschluckt rotes Licht – deshalb erscheint er blau.", en: "Methane in Neptune's atmosphere absorbs red light – so it looks blue.", es: "El metano de la atmósfera de Neptuno absorbe la luz roja; por eso se ve azul."}
q25: {de: "Das Band ist unsere Milchstraße von innen gesehen: Wir blicken in die Scheibe aus Milliarden Sternen.", en: "The band is our Milky Way seen from inside: we look into its disc of billions of stars.", es: "La banda es nuestra Vía Láctea vista desde dentro: miramos hacia su disco de miles de millones de estrellas."}
q26: {de: "Die Milchstraße ist eine Balkenspiralgalaxie mit 100 bis 400 Milliarden Sternen.", en: "The Milky Way is a barred spiral galaxy with 100 to 400 billion stars.", es: "La Vía Láctea es una galaxia espiral barrada con entre 100.000 y 400.000 millones de estrellas."}
q27: {de: "Jupiters Mond Ganymed ist der größte Mond im Sonnensystem.", en: "Jupiter's moon Ganymede is the largest moon in the solar system.", es: "Ganímedes, luna de Júpiter, es la luna más grande del sistema solar."}
q28: {de: "Ganymed ist mit 5.268 km Durchmesser sogar größer als der Planet Merkur.", en: "At 5,268 km across, Ganymede is even larger than the planet Mercury.", es: "Con 5.268 km de diámetro, Ganímedes es incluso mayor que el planeta Mercurio."}
q29: {de: "Ein Venustag dauert 243 Erdtage – länger als ihr Jahr mit 225 Tagen! Außerdem dreht sie sich rückwärts.", en: "A day on Venus lasts 243 Earth days – longer than its 225-day year! It also spins backwards.", es: "Un día en Venus dura 243 días terrestres, ¡más que su año de 225 días! Además gira al revés."}
q30: {de: "Die Sonne ist ein ganz normaler Stern – ein gelber Zwerg, rund 4,6 Milliarden Jahre alt.", en: "The Sun is a perfectly ordinary star – a yellow dwarf about 4.6 billion years old.", es: "El Sol es una estrella normal: una enana amarilla de unos 4.600 millones de años."}
q31: {de: "Seit seiner Entdeckung 1846 hat Neptun die Sonne erst einmal umrundet – 2011 war es so weit.", en: "Since its discovery in 1846 Neptune has orbited the Sun only once – completed in 2011.", es: "Desde su descubrimiento en 1846, Neptuno ha dado una sola vuelta al Sol, completada en 2011."}
q32: {de: "Ein Marstag (Sol) ist mit 24 Stunden 37 Minuten fast so lang wie ein Erdentag.", en: "A Martian day (sol) lasts 24 hours 37 minutes – almost as long as an Earth day.", es: "Un día marciano (sol) dura 24 horas y 37 minutos, casi lo mismo que un día terrestre."}
q33: {de: "Pluto teilt seine Bahn mit vielen anderen Objekten im Kuipergürtel – deshalb gilt er seit 2006 als Zwergplanet.", en: "Pluto shares its orbit with many other Kuiper-belt objects – so since 2006 it counts as a dwarf planet.", es: "Plutón comparte su órbita con muchos objetos del cinturón de Kuiper; por eso desde 2006 es un planeta enano."}
q34: {de: "Offiziell anerkannt sind Ceres, Pluto, Haumea, Makemake und Eris – es gibt aber viele weitere Kandidaten.", en: "Officially recognised are Ceres, Pluto, Haumea, Makemake and Eris – but there are many more candidates.", es: "Están reconocidos oficialmente Ceres, Plutón, Haumea, Makemake y Eris, pero hay muchos más candidatos."}
q35: {de: "Eris ist fast genauso groß wie Pluto – ihre Entdeckung 2005 löste die Debatte um Plutos Status aus.", en: "Eris is almost as large as Pluto – its discovery in 2005 started the debate about Pluto's status.", es: "Eris es casi tan grande como Plutón; su descubrimiento en 2005 desató el debate sobre Plutón."}
q36: {de: "Makemake ist ein Zwergplanet im Kuipergürtel, benannt nach einem Schöpfergott der Osterinsel.", en: "Makemake is a dwarf planet in the Kuiper belt, named after a creator god of Easter Island.", es: "Makemake es un planeta enano del cinturón de Kuiper, llamado como un dios creador de la isla de Pascua."}
q37: {de: "Sedna ist eines der fernsten bekannten Objekte; ein Umlauf dauert rund 11.000 Jahre. Offiziell als Zwergplanet anerkannt ist es (noch) nicht.", en: "Sedna is one of the most distant known objects; one orbit takes about 11,000 years. It has not (yet) been officially recognised as a dwarf planet.", es: "Sedna es uno de los objetos conocidos más lejanos; una órbita dura unos 11.000 años. Aún no está reconocido oficialmente como planeta enano."}
q38: {de: "Transneptunische Objekte wie Pluto oder Eris sind eisige Überbleibsel aus der Entstehungszeit des Sonnensystems.", en: "Trans-Neptunian objects such as Pluto or Eris are icy leftovers from the birth of the solar system.", es: "Los objetos transneptunianos como Plutón o Eris son restos helados del nacimiento del sistema solar."}
q39: {de: "Das hat Johannes Kepler 1609 herausgefunden: Planetenbahnen sind Ellipsen mit der Sonne in einem Brennpunkt.", en: "Johannes Kepler found this in 1609: planetary orbits are ellipses with the Sun at one focus.", es: "Johannes Kepler lo descubrió en 1609: las órbitas son elipses con el Sol en uno de los focos."}
q40: {de: "Die ersten Trojaner wurden ab 1906 in Heidelberg entdeckt – die NASA-Sonde Lucy fliegt gerade zu ihnen.", en: "The first Trojans were discovered from 1906 in Heidelberg – NASA's Lucy probe is on its way to them.", es: "Los primeros troyanos se descubrieron a partir de 1906 en Heidelberg; la sonda Lucy de la NASA viaja hacia ellos."}
q41: {de: "Sterne eines Haufens sind gleich alt – die Plejaden sind ein bekanntes Beispiel.", en: "The stars in a cluster are the same age – the Pleiades are a well-known example.", es: "Las estrellas de un cúmulo tienen la misma edad; las Pléyades son un ejemplo conocido."}
q42: {de: "Der Kuipergürtel ist ein Ring aus eisigen Körpern jenseits des Neptun – Pluto ist sein bekanntestes Mitglied.", en: "The Kuiper belt is a ring of icy bodies beyond Neptune – Pluto is its best-known member.", es: "El cinturón de Kuiper es un anillo de cuerpos helados más allá de Neptuno; Plutón es su miembro más conocido."}
q43: {de: "Die Oortsche Wolke reicht vermutlich bis zu einem Lichtjahr weit – von dort kommen langperiodische Kometen.", en: "The Oort cloud probably extends up to a light-year away – long-period comets come from there.", es: "La nube de Oort probablemente se extiende hasta un año luz; de allí vienen los cometas de periodo largo."}
q44: {de: "Mit einem Hohmann-Transfer fliegen Raumsonden mit wenig Treibstoff, z. B. von der Erde zum Mars.", en: "Space probes use a Hohmann transfer to travel with little fuel, e.g. from Earth to Mars.", es: "Las sondas usan una transferencia de Hohmann para viajar con poco combustible, por ejemplo de la Tierra a Marte."}
q45: {de: "Pulsare drehen sich bis zu hunderte Male pro Sekunde – ihr Strahl streift die Erde wie ein Leuchtturm.", en: "Pulsars spin up to hundreds of times per second – their beam sweeps past Earth like a lighthouse.", es: "Los púlsares giran hasta cientos de veces por segundo; su haz barre la Tierra como un faro."}
q46: {de: "Gas, das in ein riesiges Schwarzes Loch stürzt, heizt sich extrem auf und leuchtet heller als ganze Galaxien.", en: "Gas falling into a giant black hole heats up enormously and outshines entire galaxies.", es: "El gas que cae en un agujero negro gigante se calienta muchísimo y brilla más que galaxias enteras."}
q47: {de: "Magnetare haben die stärksten bekannten Magnetfelder – billiardenfach stärker als das der Erde.", en: "Magnetars have the strongest known magnetic fields – a million billion times stronger than Earth's.", es: "Los magnetares tienen los campos magnéticos más intensos conocidos: miles de billones de veces el terrestre."}
q48: {de: "Innerhalb des Ereignishorizonts müsste etwas schneller als Licht sein, um zu entkommen – also kann nichts heraus.", en: "Inside the event horizon you would need to move faster than light to escape – so nothing gets out.", es: "Dentro del horizonte de sucesos habría que ir más rápido que la luz para escapar, así que nada sale."}
q49: {de: "Sagittarius A* hat rund 4 Millionen Sonnenmassen – 2022 wurde sein „Schatten“ erstmals abgebildet.", en: "Sagittarius A* has about 4 million solar masses – its 'shadow' was first imaged in 2022.", es: "Sagitario A* tiene unos 4 millones de masas solares; su «sombra» se fotografió por primera vez en 2022."}
q50: {de: "Bei einem Blazar schauen wir genau in den Teilchenstrahl – deshalb wirkt er besonders hell und veränderlich.", en: "With a blazar we look straight down the jet – so it appears especially bright and variable.", es: "En un blazar miramos directamente al chorro; por eso parece especialmente brillante y variable."}
q51: {de: "Aktive Galaxienkerne strahlen von Radiowellen bis zu Gammastrahlung – im gesamten Spektrum.", en: "Active galactic nuclei shine from radio waves to gamma rays – across the whole spectrum.", es: "Los núcleos galácticos activos emiten desde ondas de radio hasta rayos gamma, en todo el espectro."}
q52: {de: "Das Quadrat der Umlaufzeit ist proportional zur dritten Potenz der großen Halbachse: Ferne Planeten brauchen viel länger.", en: "The square of the period is proportional to the cube of the semi-major axis: distant planets take much longer.", es: "El cuadrado del periodo es proporcional al cubo del semieje mayor: los planetas lejanos tardan mucho más."}
q53: {de: "An den fünf Lagrange-Punkten heben sich Schwerkraft und Fliehkraft auf. Nur L4 und L5 sind stabil; das James-Webb-Teleskop muss bei L2 seine Bahn regelmäßig korrigieren.", en: "At the five Lagrange points gravity and centrifugal force balance. Only L4 and L5 are stable; the James Webb telescope at L2 has to correct its orbit regularly.", es: "En los cinco puntos de Lagrange se equilibran la gravedad y la fuerza centrífuga. Solo L4 y L5 son estables; el telescopio James Webb, en L2, debe corregir su órbita con regularidad."}
q54: {de: "Deshalb sehen wir vom Mond immer dieselbe Seite.", en: "That is why we always see the same side of the Moon.", es: "Por eso siempre vemos la misma cara de la Luna."}
q55: {de: "Die äußeren Sterne kreisen zu schnell für die sichtbare Masse – unsichtbare Dunkle Materie liefert zusätzliche Schwerkraft.", en: "The outer stars orbit too fast for the visible mass – invisible dark matter adds extra gravity.", es: "Las estrellas exteriores giran demasiado rápido para la masa visible; la materia oscura aporta gravedad extra."}
q56: {de: "Die Erdachse beschreibt in rund 26.000 Jahren einen Kreis – in ferner Zukunft wird Wega unser Polarstern sein.", en: "Earth's axis traces a circle every 26,000 years – one day Vega will be our pole star.", es: "El eje terrestre describe un círculo cada 26.000 años; algún día Vega será nuestra estrella polar."}
q57: {de: "Ein Beispiel ist die Venus, die sich entgegen den meisten Planeten dreht – oder Monde, die „rückwärts“ kreisen.", en: "Examples are Venus, which spins the other way round from most planets, or moons orbiting 'backwards'.", es: "Ejemplos son Venus, que gira al revés que la mayoría de planetas, o lunas que orbitan «hacia atrás»."}
q58: {de: "Bei e = 0 ist die Bahn ein Kreis, unter 1 eine Ellipse, genau 1 eine Parabel, darüber eine Hyperbel.", en: "With e = 0 the orbit is a circle, below 1 an ellipse, exactly 1 a parabola, above 1 a hyperbola.", es: "Con e = 0 la órbita es un círculo, por debajo de 1 una elipse, exactamente 1 una parábola y por encima, una hipérbola."}
q59: {de: "Sie beträgt rund 70 km/s pro Megaparsec: Jede Galaxie entfernt sich umso schneller, je weiter sie weg ist.", en: "It is about 70 km/s per megaparsec: the farther a galaxy is, the faster it recedes.", es: "Vale unos 70 km/s por megapársec: cuanto más lejos está una galaxia, más rápido se aleja."}
q60: {de: "Dieses Licht wurde etwa 380.000 Jahre nach dem Urknall frei und ist heute auf knapp 3 Kelvin abgekühlt.", en: "This light was released about 380,000 years after the Big Bang and has cooled to under 3 kelvin today.", es: "Esta luz se liberó unos 380.000 años después del Big Bang y hoy se ha enfriado a menos de 3 kelvin."}
q61: {de: "Rund 68 % sind Dunkle Energie, 27 % Dunkle Materie und nur 5 % normale Materie. Dunkle Energie treibt die beschleunigte Ausdehnung an – was sie ist, weiß noch niemand.", en: "About 68 % is dark energy, 27 % dark matter and only 5 % normal matter. Dark energy drives the accelerating expansion – nobody yet knows what it is.", es: "Alrededor del 68 % es energía oscura, el 27 % materia oscura y solo el 5 % materia normal. La energía oscura impulsa la expansión acelerada; nadie sabe aún qué es."}
q62: {de: "Je weiter eine Galaxie entfernt ist, desto stärker ist ihr Licht zum Roten hin gedehnt.", en: "The farther away a galaxy is, the more its light is stretched towards red.", es: "Cuanto más lejos está una galaxia, más se estira su luz hacia el rojo."}
q63: {de: "In winzigen Sekundenbruchteilen soll sich das Universum um ein Vielfaches vergrößert haben.", en: "In a tiny fraction of a second the universe is thought to have grown enormously.", es: "Se cree que en una minúscula fracción de segundo el universo creció enormemente."}
q64: {de: "Große Massen wie Galaxienhaufen krümmen den Raum – das Licht dahinterliegender Galaxien wird zu Bögen verzerrt.", en: "Large masses such as galaxy clusters curve space – light from galaxies behind them is bent into arcs.", es: "Grandes masas como los cúmulos de galaxias curvan el espacio; la luz de galaxias más lejanas se deforma en arcos."}
q65: {de: "Wie bei einer Flamme: Heiße Sterne leuchten bläulich-weiß, kühlere gelb, orange oder rot.", en: "Like a flame: hot stars glow bluish-white, cooler ones yellow, orange or red.", es: "Como una llama: las estrellas calientes brillan blanco-azuladas; las más frías, amarillas, naranjas o rojas."}
q66: {de: "Die Klassen O, B, A, F, G, K, M reichen von heiß bis kühl – unsere Sonne ist ein G-Stern.", en: "The classes O, B, A, F, G, K, M run from hot to cool – our Sun is a G star.", es: "Las clases O, B, A, F, G, K, M van de calientes a frías; nuestro Sol es una estrella de tipo G."}
q67: {de: "Ein Weißer Zwerg ist so groß wie die Erde, aber so schwer wie die Sonne – ein Teelöffel wiegt Tonnen.", en: "A white dwarf is the size of Earth but as heavy as the Sun – a teaspoon of it weighs tonnes.", es: "Una enana blanca tiene el tamaño de la Tierra pero la masa del Sol: una cucharadita pesa toneladas."}
q68: {de: "Wenn der Wasserstoff im Kern verbraucht ist, bläht sich ein Stern auf – auch unsere Sonne in etwa 5 Milliarden Jahren.", en: "When the hydrogen in its core runs out, a star swells up – our Sun will too in about 5 billion years.", es: "Cuando se agota el hidrógeno del núcleo, la estrella se hincha; nuestro Sol lo hará en unos 5.000 millones de años."}
q69: {de: "Rund die Hälfte aller sonnenähnlichen Sterne hat mindestens einen Begleitstern.", en: "About half of all Sun-like stars have at least one companion star.", es: "Aproximadamente la mitad de las estrellas parecidas al Sol tienen al menos una compañera."}
q70: {de: "Im Kern der Sonne werden jede Sekunde rund 600 Millionen Tonnen Wasserstoff zu Helium verschmolzen.", en: "In the Sun's core about 600 million tonnes of hydrogen fuse into helium every second.", es: "En el núcleo del Sol se fusionan unos 600 millones de toneladas de hidrógeno en helio cada segundo."}
q71: {de: "Braune Zwerge sind zu leicht für dauerhafte Wasserstofffusion – „gescheiterte Sterne“.", en: "Brown dwarfs are too light for lasting hydrogen fusion – 'failed stars'.", es: "Las enanas marrones son demasiado ligeras para fusionar hidrógeno de forma estable: «estrellas fallidas»."}
q72: {de: "Für Astronominnen und Astronomen ist alles schwerer als Helium ein „Metall“ – auch Sauerstoff oder Kohlenstoff.", en: "For astronomers, everything heavier than helium is a 'metal' – even oxygen or carbon.", es: "Para los astrónomos todo lo más pesado que el helio es un «metal», incluso el oxígeno o el carbono."}
q73: {de: "Manche Sterne pulsieren, andere werden von einem Begleiter verdeckt – beides kann man mit dem OST-Teleskop messen.", en: "Some stars pulsate, others are eclipsed by a companion – both can be measured with the OST telescope.", es: "Algunas estrellas pulsan y otras son eclipsadas por una compañera; ambas cosas se miden con el telescopio OST."}
q74: {de: "Junge heiße Sterne regen das Gas zum Leuchten an – wie in einer Leuchtstoffröhre.", en: "Young hot stars make the gas glow – like in a fluorescent tube.", es: "Las estrellas jóvenes y calientes hacen brillar el gas, como en un tubo fluorescente."}
q75: {de: "Trotz des Namens hat er nichts mit Planeten zu tun – er ist die abgestoßene Hülle eines sterbenden Sterns.", en: "Despite the name it has nothing to do with planets – it is the ejected shell of a dying star.", es: "Pese al nombre no tiene nada que ver con planetas: es la envoltura expulsada de una estrella moribunda."}
q76: {de: "In den Spiralarmen entstehen besonders viele junge, helle Sterne – deshalb leuchten sie so deutlich.", en: "Many young, bright stars form in the spiral arms – that is why they stand out.", es: "En los brazos espirales se forman muchas estrellas jóvenes y brillantes; por eso destacan tanto."}
q77: {de: "Fast jede große Galaxie hat ein supermassereiches Schwarzes Loch – auch unsere Milchstraße.", en: "Almost every large galaxy has a supermassive black hole – our Milky Way too.", es: "Casi todas las grandes galaxias tienen un agujero negro supermasivo, también nuestra Vía Láctea."}
q78: {de: "Der Krebsnebel ist der Überrest einer Supernova, die im Jahr 1054 beobachtet wurde.", en: "The Crab Nebula is the remnant of a supernova observed in the year 1054.", es: "La nebulosa del Cangrejo es el resto de una supernova observada en el año 1054."}
q79: {de: "Zur Lokalen Gruppe gehören über 80 Galaxien – die größten sind Andromeda und unsere Milchstraße.", en: "The Local Group contains more than 80 galaxies – the largest are Andromeda and our Milky Way.", es: "El Grupo Local tiene más de 80 galaxias; las mayores son Andrómeda y nuestra Vía Láctea."}
q80: {de: "Angeregter Wasserstoff leuchtet bei der „H-alpha“-Linie tiefrot – daher die rote Farbe vieler Nebel.", en: "Excited hydrogen glows deep red at the 'H-alpha' line – hence the red colour of many nebulae.", es: "El hidrógeno excitado brilla en rojo intenso en la línea «H-alfa»; de ahí el color de muchas nebulosas."}
q81: {de: "Irreguläre Galaxien wie die Magellanschen Wolken wurden oft durch Nachbargalaxien verformt.", en: "Irregular galaxies such as the Magellanic Clouds have often been distorted by neighbouring galaxies.", es: "Las galaxias irregulares como las Nubes de Magallanes suelen estar deformadas por galaxias vecinas."}
q82: {de: "Aus der Rotverschiebung und der Hubble-Konstante lässt sich die Entfernung ferner Galaxien berechnen.", en: "From the redshift and the Hubble constant you can work out the distance of far-away galaxies.", es: "Con el corrimiento al rojo y la constante de Hubble se calcula la distancia de galaxias lejanas."}
q83: {de: "Die Sonne ist 400-mal größer als der Mond, aber auch 400-mal weiter weg – deshalb passt er genau davor.", en: "The Sun is 400 times larger than the Moon but also 400 times farther away – so the Moon fits right in front.", es: "El Sol es 400 veces mayor que la Luna, pero está 400 veces más lejos; por eso la Luna lo tapa justo."}
q84: {de: "Bei einer Mondfinsternis färbt sich der Mond oft kupferrot – durch Sonnenlicht, das die Erdatmosphäre umlenkt.", en: "During a lunar eclipse the Moon often turns copper-red – from sunlight bent by Earth's atmosphere.", es: "En un eclipse lunar la Luna suele volverse rojiza, por la luz solar desviada por la atmósfera terrestre."}
q85: {de: "Mond und Sonne ziehen unterschiedlich stark an den Ozeanen – das Wasser türmt sich zu Ebbe und Flut.", en: "The Moon and the Sun pull differently on the oceans – the water piles up into tides.", es: "La Luna y el Sol atraen de forma distinta a los océanos; el agua se acumula en mareas."}
q86: {de: "Die Erde kreuzt jedes Jahr die Staubspur eines Kometen – z. B. im August bei den Perseiden.", en: "Each year Earth crosses a comet's dust trail – e.g. in August during the Perseids.", es: "Cada año la Tierra cruza el rastro de polvo de un cometa, por ejemplo en agosto con las Perseidas."}
q87: {de: "Teilchen von der Sonne bringen Sauerstoff und Stickstoff in der Hochatmosphäre zum Leuchten – grün und rot.", en: "Particles from the Sun make oxygen and nitrogen in the upper atmosphere glow – green and red.", es: "Partículas del Sol hacen brillar el oxígeno y el nitrógeno de la alta atmósfera, en verde y rojo."}
q88: {de: "Beim Transit wird der Stern ein winziges bisschen dunkler – so wurden Tausende Exoplaneten entdeckt.", en: "During a transit the star dims very slightly – that is how thousands of exoplanets were found.", es: "Durante un tránsito la estrella se oscurece muy levemente; así se han descubierto miles de exoplanetas."}
q89: {de: "Bis heute sind über 5.000 Exoplaneten bekannt – der erste um einen sonnenähnlichen Stern wurde 1995 entdeckt.", en: "More than 5,000 exoplanets are known today – the first around a Sun-like star was found in 1995.", es: "Hoy se conocen más de 5.000 exoplanetas; el primero alrededor de una estrella como el Sol se halló en 1995."}
q90: {de: "Die Erde erreicht ihr Perihel Anfang Januar – im Nordwinter sind wir der Sonne am nächsten.", en: "Earth reaches perihelion in early January – we are closest to the Sun in northern winter.", es: "La Tierra llega al perihelio a principios de enero: estamos más cerca del Sol en el invierno boreal."}
q91: {de: "In Opposition steht ein Planet die ganze Nacht am Himmel und ist besonders hell – ideal zum Beobachten.", en: "At opposition a planet is up all night and especially bright – ideal for observing.", es: "En oposición un planeta está toda la noche en el cielo y muy brillante: ideal para observar."}
q92: {de: "Im All gibt es kein Luftflimmern, keine Wolken – und man sieht auch Licht, das die Atmosphäre verschluckt.", en: "In space there is no air shimmer, no clouds – and you can see light that the atmosphere absorbs.", es: "En el espacio no hay turbulencia ni nubes, y se ve luz que la atmósfera absorbe."}
q93: {de: "Radioteleskope empfangen Radiowellen von Gaswolken, Pulsaren oder Galaxien – sogar tagsüber.", en: "Radio telescopes pick up radio waves from gas clouds, pulsars or galaxies – even in daytime.", es: "Los radiotelescopios captan ondas de radio de nubes de gas, púlsares o galaxias, incluso de día."}
q94: {de: "Ein verformbarer Spiegel gleicht das Luftflimmern hunderte Male pro Sekunde aus.", en: "A deformable mirror corrects the air shimmer hundreds of times per second.", es: "Un espejo deformable corrige la turbulencia del aire cientos de veces por segundo."}
q95: {de: "Raumsonden wie Voyager 1 sind schon über 24 Milliarden Kilometer von der Erde entfernt.", en: "Probes like Voyager 1 are already more than 24 billion kilometres from Earth.", es: "Sondas como la Voyager 1 están ya a más de 24.000 millones de kilómetros de la Tierra."}
q96: {de: "Alles Warme strahlt Infrarot ab – ein ungekühltes Teleskop würde sich selbst „sehen“.", en: "Everything warm emits infrared – an uncooled telescope would 'see' itself.", es: "Todo lo que está caliente emite infrarrojo; un telescopio sin enfriar «se vería» a sí mismo."}
q97: {de: "Ein Parsec sind 3,26 Lichtjahre – die Entfernung, bei der die Parallaxe genau eine Bogensekunde beträgt.", en: "One parsec is 3.26 light-years – the distance at which the parallax is exactly one arcsecond.", es: "Un pársec son 3,26 años luz: la distancia a la que la paralaje es exactamente un segundo de arco."}
q98: {de: "Ein Lichtjahr ist eine Strecke, keine Zeit: rund 9,5 Billionen Kilometer.", en: "A light-year is a distance, not a time: about 9.5 trillion kilometres.", es: "Un año luz es una distancia, no un tiempo: unos 9,5 billones de kilómetros."}
q99: {de: "Je kleiner die Magnitude, desto heller – Sirius hat −1,5 mag, die schwächsten Sterne im OST-Bild etwa 18 mag.", en: "The smaller the magnitude, the brighter – Sirius is −1.5 mag, the faintest stars in an OST image about 18 mag.", es: "Cuanto menor es la magnitud, más brillo: Sirio tiene −1,5 mag y las estrellas más débiles de una imagen OST, unas 18 mag."}
q100: {de: "So lassen sich Sterne fair vergleichen – als stünden alle in derselben Entfernung von 10 Parsec.", en: "This lets us compare stars fairly – as if they were all at the same distance of 10 parsecs.", es: "Así se comparan las estrellas de forma justa, como si todas estuvieran a la misma distancia de 10 pársecs."}
q101: {de: "Halte einen Daumen vor das Gesicht und schließe abwechselnd die Augen – so funktioniert Parallaxe.", en: "Hold up a thumb and close each eye in turn – that is how parallax works.", es: "Pon un pulgar delante de la cara y cierra un ojo y luego el otro: así funciona la paralaje."}
q102: {de: "Cepheiden pulsieren umso langsamer, je heller sie sind – damit werden sie zu kosmischen Maßbändern.", en: "The brighter a Cepheid, the slower it pulsates – which turns them into cosmic measuring tapes.", es: "Cuanto más brillante es una cefeida, más lento pulsa; eso las convierte en cintas métricas cósmicas."}
